name: build-windows-exe

on:
  push:
    branches:
      - arena/01a0854d-repo
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prepare:assets
      - run: npm run dist:win
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AgroPrognoz-Windows-x64
          path: |
            dist/*.exe
          if-no-files-found: error
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 dist/*.exe --clobber
          else
            gh release create v1.0.0 dist/*.exe --title "АгроПрогноз v1.0.0" --notes "Портативная сборка АгроПрогноз для Windows (x64)."
          fi
