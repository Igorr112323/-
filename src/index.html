<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://server.arcgisonline.com; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <title>АгроПрогноз — Кукуруза</title>
  <link rel="stylesheet" href="./vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <div class="brand-text">
          <span class="brand-name">АгроПрогноз</span>
          <span class="brand-tag">Кукуруза</span>
        </div>
      </div>
      
      <nav class="sidenav" id="sidenav">
        <button class="nav-btn is-active" id="nav-map" type="button">
          <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
          <span class="nav-text">Карта</span>
        </button>
        <button class="nav-btn" id="nav-data" type="button">
          <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
          <span class="nav-text">Данные</span>
        </button>
        <button class="nav-btn" id="nav-reports" type="button">
          <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><path d="M9 13h6M9 17h6M14 2v5h5"/></svg>
          <span class="nav-text">Отчёты</span>
        </button>
        <button class="nav-btn" id="nav-varieties" type="button">
          <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v4h-7zM13 12h7v8h-7zM4 15h7v5H4z"/></svg>
          <span class="nav-text">Сорта</span>
        </button>
      </nav>

      <div class="sidebar-bottom">
        <div class="demo-badge">
          <span class="demo-dot"></span>
          <span>Демо-режим</span>
        </div>
      </div>
    </aside>

    <main id="stage">
      <section class="view is-active" id="view-map">
        <div id="map"></div>
        <div class="map-hint" id="map-hint">
          <span class="hint-ping"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
          <div class="hint-body">
            <span class="hint-title">Выберите участок на карте</span>
            <span class="hint-sub">Нажмите на нужное место, чтобы настроить прогноз</span>
          </div>
        </div>
        
        <aside class="panel" id="panel">
          <div class="panel-head">
            <h2 class="panel-title">Новый прогноз</h2>
          </div>

          <div class="panel-body" id="panel-body">
            <div class="panel-section" id="coords-section">
              <label class="section-label">Участок</label>
              <div class="coords-box" id="coords-box">
                <div class="coords-empty" id="coords-empty">Точка не выбрана<br/><small>Нажмите на карту</small></div>
                <div class="coords-values hidden" id="coords-values">
                  <div class="coord-row"><span class="coord-axis">Широта</span><span class="coord-num" id="coord-lat">—</span></div>
                  <div class="coord-row"><span class="coord-axis">Долгота</span><span class="coord-num" id="coord-lon">—</span></div>
                </div>
              </div>
            </div>

            <div class="panel-section">
              <label class="section-label">Сорт кукурузы</label>
              <select id="variety-select" class="select input-field"></select>
            </div>

            <div class="panel-section">
              <label class="section-label">Период</label>
              <div class="seg" id="range-seg">
                <div class="seg-thumb" id="seg-thumb"></div>
                <button class="seg-btn is-active" data-range="1" type="button">1 месяц</button>
                <button class="seg-btn" data-range="3" type="button">3 месяца</button>
                <button class="seg-btn" data-range="6" type="button">6 месяцев</button>
              </div>
            </div>

            <div class="panel-section">
              <label class="section-label">Дата начала</label>
              <button class="date-button input-field" id="date-button" type="button">
                <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2v3M17 2v3M3.5 8h17M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>
                <span id="date-value">Сегодня</span>
                <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
              </button>
              <div class="calendar-wrap" id="calendar-wrap">
                <div id="calendar"></div>
              </div>
            </div>

            <button class="btn-primary" id="forecast-btn" type="button" disabled>
              <span>Спрогнозировать</span>
            </button>
            <div class="btn-hint" id="forecast-btn-hint">Выберите точку на карте</div>
          </div>
        </aside>
      </section>

      <section class="view" id="view-results"></section>
      <section class="view view-scroll" id="view-data"></section>
      <section class="view view-scroll" id="view-reports"></section>
      <section class="view view-scroll" id="view-varieties"></section>
    </main>
  </div>

  <div class="overlay hidden" id="loading-overlay">
    <div class="load-card">
      <div class="load-spinner"></div>
      <h2 class="load-title" id="load-title">Подготавливаем демонстрационный прогноз</h2>
      <div class="load-bar"><div class="load-fill" id="load-fill"></div></div>
      <ul class="load-steps" id="load-steps"></ul>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="./vendor/sqljs/sql-wasm.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
